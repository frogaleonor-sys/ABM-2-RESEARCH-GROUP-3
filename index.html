<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, user-scalable=no"
    >

    <title>ABM-2 Research Archive</title>

    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         RESEARCH BOOK READER
    ========================== -->

    <div id="readerUI" class="book-reader-ui">

        <h2 id="bookTitle">
            Research Section
        </h2>

        <div id="bookPages" class="page-content"></div>

        <div class="ui-controls">

            <button
                class="ui-btn"
                onclick="prevPage()"
            >
                ◀ Prev
            </button>

            <span id="pageNumber">
                1 / 1
            </span>

            <button
                class="ui-btn"
                onclick="nextPage()"
            >
                Next ▶
            </button>

            <button
                class="ui-btn close-btn"
                onclick="closeBook()"
            >
                Close
            </button>

        </div>

    </div>


    <!-- =========================
         TOP LABEL
    ========================== -->

    <div class="mobile-tip">
        📖 <b>ABM-2 Research Archive</b> — Manila High School
    </div>


    <!-- =========================
         3D LIBRARY
    ========================== -->

    <a-scene
        cursor="rayOrigin: mouse"
        raycaster="objects: .clickable"
        renderer="antialias: true"
    >

        <!-- Background -->

        <a-sky color="#120a04"></a-sky>


        <!-- Camera -->

        <a-camera
            position="0 1.6 0"
            look-controls="magicWindowTrackingEnabled: false"
            wasd-controls-enabled="false"
        ></a-camera>


        <!-- Lighting -->

        <a-entity
            light="type: ambient; color: #6e5b4f; intensity: 1.8"
        ></a-entity>

        <a-entity
            light="type: point; color: #ffbb66; intensity: 1.5"
            position="0 3 1"
        ></a-entity>


        <!-- =========================
             BOOKSHELF
        ========================== -->

        <a-entity position="0 0 -2.3">

            <!-- Shelf -->

            <a-box
                position="0 1.4 0"
                width="3.9"
                height="2.2"
                depth="0.4"
                color="#3d2516"
            ></a-box>


            <!-- =========================
                 INTRODUCTION
            ========================== -->

            <a-entity
                class="clickable"
                onclick="openBook('intro')"
                position="-1.2 1.25 0.25"
            >

                <a-box
                    width="0.62"
                    height="0.98"
                    depth="0.13"
                    color="#7a2b2b"
                ></a-box>

                <a-box
                    position="0 0 0.07"
                    width="0.51"
                    height="0.87"
                    depth="0.01"
                    color="#5c1e1e"
                ></a-box>

                <a-text
                    value="INTRODUCTION"
                    position="0 0.22 0.08"
                    align="center"
                    width="1.15"
                    color="#f8e8c8"
                ></a-text>

                <a-text
                    value="ABM-2"
                    position="0 -0.15 0.08"
                    align="center"
                    width="0.8"
                    color="#d9b783"
                ></a-text>

                <a-text
                    value="RESEARCH"
                    position="0 -0.32 0.08"
                    align="center"
                    width="0.75"
                    color="#d9b783"
                ></a-text>

            </a-entity>


            <!-- =========================
                 BACKGROUND
            ========================== -->

            <a-entity
                class="clickable"
                onclick="openBook('background')"
                position="-0.4 1.25 0.25"
            >

                <a-box
                    width="0.62"
                    height="0.98"
                    depth="0.13"
                    color="#2b4739"
                ></a-box>

                <a-box
                    position="0 0 0.07"
                    width="0.51"
                    height="0.87"
                    depth="0.01"
                    color="#20362c"
                ></a-box>

                <a-text
                    value="BACKGROUND"
                    position="0 0.20 0.08"
                    align="center"
                    width="1.15"
                    color="#f4ecd8"
                ></a-text>

                <a-text
                    value="OF THE"
                    position="0 0.00 0.08"
                    align="center"
                    width="0.85"
                    color="#f4ecd8"
                ></a-text>

                <a-text
                    value="STUDY"
                    position="0 -0.20 0.08"
                    align="center"
                    width="0.95"
                    color="#f4ecd8"
                ></a-text>

            </a-entity>


            <!-- =========================
                 RESEARCH GAP
            ========================== -->

            <a-entity
                class="clickable"
                onclick="openBook('gap')"
                position="0.4 1.25 0.25"
            >

                <a-box
                    width="0.62"
                    height="0.98"
                    depth="0.13"
                    color="#463457"
                ></a-box>

                <a-box
                    position="0 0 0.07"
                    width="0.51"
                    height="0.87"
                    depth="0.01"
                    color="#342742"
                ></a-box>

                <a-text
                    value="RESEARCH"
                    position="0 0.18 0.08"
                    align="center"
                    width="1.1"
                    color="#f5e9ff"
                ></a-text>

                <a-text
                    value="GAP"
                    position="0 -0.03 0.08"
                    align="center"
                    width="1"
                    color="#f5e9ff"
                ></a-text>

                <a-text
                    value="ABM-2"
                    position="0 -0.30 0.08"
                    align="center"
                    width="0.75"
                    color="#d6c0e7"
                ></a-text>

            </a-entity>


            <!-- =========================
                 STATEMENT OF THE PROBLEM
            ========================== -->

            <a-entity
                class="clickable"
                onclick="openBook('sop')"
                position="1.2 1.25 0.25"
            >

                <a-box
                    width="0.62"
                    height="0.98"
                    depth="0.13"
                    color="#8c6c3d"
                ></a-box>

                <a-box
                    position="0 0 0.07"
                    width="0.51"
                    height="0.87"
                    depth="0.01"
                    color="#70552f"
                ></a-box>

                <a-text
                    value="STATEMENT"
                    position="0 0.22 0.08"
                    align="center"
                    width="1.05"
                    color="#fff5dc"
                ></a-text>

                <a-text
                    value="OF THE"
                    position="0 0.02 0.08"
                    align="center"
                    width="0.85"
                    color="#fff5dc"
                ></a-text>

                <a-text
                    value="PROBLEM"
                    position="0 -0.18 0.08"
                    align="center"
                    width="1.05"
                    color="#fff5dc"
                ></a-text>

            </a-entity>

        </a-entity>

    </a-scene>


    <!-- JavaScript -->

    <script src="script.js"></script>

</body>
</html>
