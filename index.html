<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ABM-2 Research Archive</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <style>
        .book-reader-ui { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 90%; max-width: 420px; background: #fdfbf7; color: #2b1d0c; padding: 25px; box-shadow: 0 10px 40px rgba(0,0,0,0.8); border-radius: 6px; border: 1px solid #d2b48c; border-left: 18px solid #4a2e1b; font-family: 'Georgia', serif; z-index: 9999; box-sizing: border-box; }
        .book-reader-ui h2 { margin-top: 0; color: #4a2311; font-size: 20px; border-bottom: 2px solid #b59975; padding-bottom: 8px; text-align: center; }
        .page-content { min-height: 250px; max-height: 350px; overflow-y: auto; line-height: 1.6; font-size: 15px; white-space: pre-wrap; margin-top: 15px; }
        .ui-controls { display: flex; justify-content: space-between; margin-top: 25px; }
        .ui-btn { background: #4a2e1b; color: #fdfbf7; border: none; padding: 10px 16px; cursor: pointer; font-family: inherit; font-weight: bold; border-radius: 3px; font-size: 13px; }
        .close-btn { background: #8a2525; }
        .mobile-tip { position: fixed; top: 15px; left: 50%; transform: translateX(-50%); color: #f4ecd8; background: rgba(43, 29, 12, 0.9); padding: 8px 18px; font-family: sans-serif; font-size: 13px; text-align: center; pointer-events: none; z-index: 999; border-radius: 20px; border: 1px solid #d2b48c; }
    </style>
</head>
<body>

    <div id="readerUI" class="book-reader-ui">
        <h2 id="bookTitle">Section Title</h2>
        <div id="bookPages" class="page-content"></div>
        <div class="ui-controls">
            <button class="ui-btn" onclick="prevPage()">◀ Prev</button>
            <span id="pageNumber" style="align-self: center; font-weight: bold; font-size: 14px;">1/1</span>
            <button class="ui-btn" onclick="nextPage()">Next ▶</button>
            <button class="ui-btn close-btn" onclick="closeBook()">Close</button>
        </div>
    </div>

    <div class="mobile-tip">📖 <b>ABM-2 Research: Manila High School</b></div>

    <a-scene cursor="rayOrigin: mouse" raycaster="objects: .clickable">
        <a-sky color="#120a04"></a-sky>
        <a-camera look-controls="magicWindowTrackingEnabled: false" wasd-controls-enabled="false" position="0 1.6 0"></a-camera>
        <a-entity light="type: ambient; color: #6e5b4f; intensity: 1.8"></a-entity>
        <a-entity light="type: point; color: #ffbb66; intensity: 1.3" position="0 2.5 0"></a-entity>

        <a-entity position="0 0 -2.3">
            <a-box position="0 1.4 0" width="3.6" height="2.2" depth="0.4" color="#3d2516"></a-box>
            <a-box class="clickable" onclick="openBook('intro')" position="-1.2 1.25 0.15" width="0.15" height="0.55" depth="0.32" color="#7a2b2b"></a-box>
            <a-box class="clickable" onclick="openBook('background')" position="-0.4 1.25 0.15" width="0.16" height="0.58" depth="0.32" color="#2b4739"></a-box>
            <a-box class="clickable" onclick="openBook('gap')" position="0.4 1.25 0.15" width="0.14" height="0.54" depth="0.32" color="#463457"></a-box>
            <a-box class="clickable" onclick="openBook('sop')" position="1.2 1.25 0.15" width="0.15" height="0.56" depth="0.32" color="#8c6c3d"></a-box>
        </a-entity>
    </a-scene>

    <script>
        const libraryDatabase = {
            intro: {
                title: "📘 Introduction",
                pages: [
                    "Researchers:\nNicole Fransisco, Aj Molina, Jaymee Nimo, Chrislyn Santos\n\nManaging money is an important skill that every student needs to develop, especially during senior high school. For most, their daily allowance serves as their primary source of money.",
                    "The amount of daily allowance a student receives may be associated with how they manage and spend their money. Budgeting and spending habits play a significant role in helping students meet their daily needs while avoiding unnecessary expenses.",
                    "This study aims to determine the relationship between the daily allowance and the budgeting and spending habits of senior high school students. The findings may help students become more financially responsible."
                ]
            },
            background: {
                title: "📘 Background of the Study",
                pages: [
                    "Financial management is a crucial competency for all individuals, particularly students. It involves the proper planning, allocation, and control of financial resources.",
                    "Daily allowance serves as the primary financial resource for transportation, meals, and supplies. The amount varies depending on family circumstances.",
                    "Studies by Rodriguez et al. (2023) and Jumawan-Powao et al. (2024) emphasize that financial planning and economic background significantly correlate with students' financial management practices."
                ]
            },
            gap: {
                title: "📘 Research Gap",
                pages: [
                    "Although previous studies have examined daily allowance and spending habits, many focused on college students and working professionals.",
                    "There is a lack of localized evidence regarding how daily allowance relates to the habits of students specifically at Manila High School.",
                    "This research addresses this gap by investigating these variables among Grade 11 and 12 students at MHS."
                ]
            },
            sop: {
                title: "📘 Statement of the Problem",
                pages: [
                    "This study aims to determine the relationship between daily allowance and budgeting/spending habits of SHS students at Manila High School (AY 2026–2027).",
                    "1. Demographic Profile (Age, Sex, Grade, Strand)\n2. Daily Allowance (₱50 to ₱251+)\n3. Level of Budgeting Habits\n4. Level of Spending Habits\n5. Significant Relationship check."
                ]
            }
        };

        let currentBookKey = ''; let currentPageIndex = 0;
        function openBook(key) { currentBookKey = key; currentPageIndex = 0; updateReaderUI(); document.getElementById('readerUI').style.display = 'block'; }
        function updateReaderUI() { const b = libraryDatabase[currentBookKey]; document.getElementById('bookTitle').innerText = b.title; document.getElementById('bookPages').innerText = b.pages[currentPageIndex]; document.getElementById('pageNumber').innerText = `${currentPageIndex + 1} / ${b.pages.length}`; }
        function nextPage() { const b = libraryDatabase[currentBookKey]; if (currentPageIndex < b.pages.length - 1) { currentPageIndex++; updateReaderUI(); } }
        function prevPage() { if (currentPageIndex > 0) { currentPageIndex--; updateReaderUI(); } }
        function closeBook() { document.getElementById('readerUI').style.display = 'none'; }
    </script>
</body>
</html>
