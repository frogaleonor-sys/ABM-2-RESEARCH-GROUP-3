<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, user-scalable=no"
    >

    <title>ABM-2 Research Archive</title>

    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         BOOK READER
    ========================== -->

    <div id="readerUI" class="book-reader-ui">

        <div class="book-spine"></div>

        <div class="reader-inner">

            <div class="reader-header">

                <div class="small-label">
                    ABM-2 RESEARCH ARCHIVE
                </div>

                <h2 id="bookTitle">
                    Research Section
                </h2>

            </div>

            <div id="bookPages" class="page-content"></div>

            <div class="ui-controls">

                <button
                    id="prevButton"
                    class="ui-btn"
                    onclick="prevPage()"
                >
                    ◀ Prev
                </button>

                <span id="pageNumber">
                    1 / 1
                </span>

                <button
                    id="nextButton"
                    class="ui-btn"
                    onclick="nextPage()"
                >
                    Next ▶
                </button>

                <button
                    class="ui-btn close-btn"
                    onclick="closeBook()"
                >
                    Close
                </button>

            </div>

        </div>

    </div>


    <!-- =========================
         TOP INFORMATION
    ========================== -->

    <div class="mobile-tip">
        📖 <b>ABM-2 Research Archive</b> — Manila High School
    </div>


    <!-- =========================
         3D SCENE
    ========================== -->

    <a-scene
        embedded
        cursor="rayOrigin: mouse"
        raycaster="objects: .clickable"
        renderer="antialias: true; colorManagement: true"
        vr-mode-ui="enabled: false"
    >

        <!-- Background -->

        <a-sky color="#120a04"></a-sky>


        <!-- Camera -->

        <a-camera
            position="0 1.6 0"
            look-controls="magicWindowTrackingEnabled: false"
            wasd-controls-enabled="false"
        ></a-camera>


        <!-- Lighting -->

        <a-entity
            light="type: ambient; color: #8c7968; intensity: 2"
        ></a-entity>

        <a-entity
            light="type: point; color: #ffbb66; intensity: 2"
            position="0 3 1"
        ></a-entity>

        <a-entity
            light="type: point; color: #c88645; intensity: 1"
            position="0 1.5 -2"
        ></a-entity>


        <!-- =========================
             LIBRARY
        ========================== -->

        <a-entity position="0 0 -2.7">


            <!-- =====================
                 BOOKSHELF BACK
            ====================== -->

            <a-box
                position="0 1.4 0"
                width="4.5"
                height="2.4"
                depth="0.35"
                color="#3d2516"
            ></a-box>


            <!-- TOP SHELF -->

            <a-box
                position="0 0.78 0.15"
                width="4.4"
                height="0.15"
                depth="0.55"
                color="#5b371f"
            ></a-box>


            <!-- BOTTOM SHELF -->

            <a-box
                position="0 2.02 0.15"
                width="4.4"
                height="0.15"
                depth="0.55"
                color="#5b371f"
            ></a-box>


            <!-- =========================
                 INTRODUCTION BOOK
            ========================== -->

            <a-entity
                position="-1.35 1.38 0.28"
            >

                <a-box
                    class="clickable"
                    onclick="openBook('intro')"
                    width="0.72"
                    height="1.05"
                    depth="0.18"
                    color="#7a2b2b"
                ></a-box>

                <a-box
                    position="0 0 0.095"
                    width="0.61"
                    height="0.94"
                    depth="0.015"
                    color="#5c1e1e"
                ></a-box>

                <a-box
                    position="-0.29 0 0.11"
                    width="0.025"
                    height="0.94"
                    depth="0.025"
                    color="#d4b27a"
                ></a-box>

                <a-text
                    value="THE"
                    position="0 0.31 0.12"
                    align="center"
                    width="1.15"
                    color="#f8e8c8"
                ></a-text>

                <a-text
                    value="RELATIONSHIP"
                    position="0 0.17 0.12"
                    align="center"
                    width="1.15"
                    color="#f8e8c8"
                ></a-text>

                <a-text
                    value="BETWEEN"
                    position="0 0.03 0.12"
                    align="center"
                    width="1.05"
                    color="#f8e8c8"
                ></a-text>

                <a-text
                    value="DAILY"
                    position="0 -0.10 0.12"
                    align="center"
                    width="1.05"
                    color="#f8e8c8"
                ></a-text>

                <a-text
                    value="ALLOWANCE"
                    position="0 -0.24 0.12"
                    align="center"
                    width="1.1"
                    color="#f8e8c8"
                ></a-text>

                <a-text
                    value="INTRODUCTION"
                    position="0 -0.42 0.12"
                    align="center"
                    width="0.8"
                    color="#d9b783"
                ></a-text>

            </a-entity>


            <!-- =========================
                 BACKGROUND BOOK
            ========================== -->

            <a-entity
                position="-0.45 1.38 0.28"
            >

                <a-box
                    class="clickable"
                    onclick="openBook('background')"
                    width="0.72"
                    height="1.05"
                    depth="0.18"
                    color="#2b4739"
                ></a-box>

                <a-box
                    position="0 0 0.095"
                    width="0.61"
                    height="0.94"
                    depth="0.015"
                    color="#20362c"
                ></a-box>

                <a-box
                    position="-0.29 0 0.11"
                    width="0.025"
                    height="0.94"
                    depth="0.025"
                    color="#d8c29b"
                ></a-box>

                <a-text
                    value="BACKGROUND"
                    position="0 0.23 0.12"
                    align="center"
                    width="1.15"
                    color="#f4ecd8"
                ></a-text>

                <a-text
                    value="OF THE"
                    position="0 0.05 0.12"
                    align="center"
                    width="1"
                    color="#f4ecd8"
                ></a-text>

                <a-text
                    value="STUDY"
                    position="0 -0.13 0.12"
                    align="center"
                    width="1.05"
                    color="#f4ecd8"
                ></a-text>

                <a-text
                    value="CHAPTER 1"
                    position="0 -0.40 0.12"
                    align="center"
                    width="0.75"
                    color="#cbb58c"
                ></a-text>

            </a-entity>


            <!-- =========================
                 RESEARCH GAP BOOK
            ========================== -->

            <a-entity
                position="0.45 1.38 0.28"
            >

                <a-box
                    class="clickable"
                    onclick="openBook('gap')"
                    width="0.72"
                    height="1.05"
                    depth="0.18"
                    color="#463457"
                ></a-box>

                <a-box
                    position="0 0 0.095"
                    width="0.61"
                    height="0.94"
                    depth="0.015"
                    color="#342742"
                ></a-box>

                <a-box
                    position="-0.29 0 0.11"
                    width="0.025"
                    height="0.94"
                    depth="0.025"
                    color="#d5c0e5"
                ></a-box>

                <a-text
                    value="RESEARCH"
                    position="0 0.24 0.12"
                    align="center"
                    width="1.1"
                    color="#f5e9ff"
                ></a-text>

                <a-text
                    value="GAP"
                    position="0 0.06 0.12"
                    align="center"
                    width="1.15"
                    color="#f5e9ff"
                ></a-text>

                <a-text
                    value="LOCALIZED"
                    position="0 -0.13 0.12"
                    align="center"
                    width="0.95"
                    color="#d6c0e7"
                ></a-text>

                <a-text
                    value="EVIDENCE"
                    position="0 -0.27 0.12"
                    align="center"
                    width="0.95"
                    color="#d6c0e7"
                ></a-text>

                <a-text
                    value="CHAPTER 1"
                    position="0 -0.43 0.12"
                    align="center"
                    width="0.75"
                    color="#bba4cf"
                ></a-text>

            </a-entity>


            <!-- =========================
                 STATEMENT OF PROBLEM
            ========================== -->

            <a-entity
                position="1.35 1.38 0.28"
            >

                <a-box
                    class="clickable"
                    onclick="openBook('sop')"
                    width="0.72"
                    height="1.05"
                    depth="0.18"
                    color="#8c6c3d"
                ></a-box>

                <a-box
                    position="0 0 0.095"
                    width="0.61"
                    height="0.94"
                    depth="0.015"
                    color="#70552f"
                ></a-box>

                <a-box
                    position="-0.29 0 0.11"
                    width="0.025"
                    height="0.94"
                    depth="0.025"
                    color="#ead09a"
                ></a-box>

                <a-text
                    value="STATEMENT"
                    position="0 0.24 0.12"
                    align="center"
                    width="1.05"
                    color="#fff5dc"
                ></a-text>

                <a-text
                    value="OF THE"
                    position="0 0.06 0.12"
                    align="center"
                    width="0.95"
                    color="#fff5dc"
                ></a-text>

                <a-text
                    value="PROBLEM"
                    position="0 -0.12 0.12"
                    align="center"
                    width="1.1"
                    color="#fff5dc"
                ></a-text>

                <a-text
                    value="CHAPTER 1"
                    position="0 -0.40 0.12"
                    align="center"
                    width="0.75"
                    color="#e1c38b"
                ></a-text>

            </a-entity>


        </a-entity>

    </a-scene>


    <script src="script.js"></script>

</body>
                    </html>
